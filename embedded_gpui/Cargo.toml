[package]
name = "embedded_gpui"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "GPUI running inside a Wasm component, embedded back into a native GPUI app"

[lints]
workspace = true

[lib]
path = "src/embedded_gpui.rs"

# The schema layer (shared specs, messages, receipts, SharedCaller) is common; the host
# runtime compiles only natively and the guest platform compiles only for wasm32, so one
# crate serves both sides of the boundary.
[dependencies]
anyhow = "1.0"
futures = "0.3"
# Object ids are random u64s (see src/registry.rs); getrandom supports
# wasm32-wasip2 natively via wasi:random.
getrandom = "0.3"
# gpui is consumed from the zed repository: the node engine (zed-industries/zed#63800)
# plus the attached-root API (Window::attach_root, take_root_scene,
# take_root_overlay_scene, root_overlay_hit_regions) on branch gpui-multi-root-embedded,
# which the guest needs to draw every surface as a root of a window mirroring the host's.
# Move to main once both land there.
gpui = { git = "https://github.com/zed-industries/zed.git", branch = "gpui-multi-root-embedded", default-features = false }
embedded_gpui_macros = { path = "../embedded_gpui_macros" }
log = "0.4"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
gpui = { git = "https://github.com/zed-industries/zed.git", branch = "gpui-multi-root-embedded" }
image = "0.25"
smallvec = { version = "1.6", features = ["union", "const_new"] }
wasmtime = { version = "36", default-features = false, features = [
    "async",
    "demangle",
    "runtime",
    "cranelift",
    "component-model",
    "incremental-cache",
    "parallel-compilation",
] }
wasmtime-wasi = "36"

[target.'cfg(target_arch = "wasm32")'.dependencies]
raw-window-handle = "0.6"
uuid = "1"
wit-bindgen = "0.41"
