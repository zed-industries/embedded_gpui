[package]
name = "embedded_gpui_js"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "JavaScript plugins for embedded_gpui: a QuickJS runtime that speaks the object model, and TypeScript declarations for its schemas"

[lints]
workspace = true

[lib]
path = "src/embedded_gpui_js.rs"

[dependencies]
anyhow = "1.0"
embedded_gpui = { path = "../embedded_gpui" }
gpui = { git = "https://github.com/zed-industries/zed.git", branch = "gpui-embedded-in-gpui", default-features = false }

# The runtime itself only exists in the guest: QuickJS is compiled into the component.
[target.'cfg(target_arch = "wasm32")'.dependencies]
futures = "0.3"
rquickjs = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
