[package]
name = "example_host"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "Demo host: a native GPUI window embedding the example plugin"

[lints]
workspace = true

[dependencies]
embedded_gpui = { path = "../../embedded_gpui" }
embedded_gpui_util = { path = "../../embedded_gpui_util" }
example_schema = { path = "../schema" }
env_logger = "0.11"
gpui = { path = "../../../zed/crates/gpui" }
gpui_platform = { path = "../../../zed/crates/gpui_platform", features = ["font-kit", "wayland", "x11"] }
log = "0.4"
