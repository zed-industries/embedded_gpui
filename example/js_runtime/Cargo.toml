[package]
name = "js_runtime"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "The JavaScript runtime as a plugin component: embedded_gpui_js, registered"

# Deliberately not part of the root workspace: compiled to wasm32-wasip2.
[workspace]

[lib]
path = "src/js_runtime.rs"
crate-type = ["cdylib"]

[dependencies]
embedded_gpui = { path = "../../embedded_gpui" }
embedded_gpui_js = { path = "../../embedded_gpui_js" }

[profile.release]
lto = true
opt-level = "s"

[patch.crates-io]
async-task = { git = "https://github.com/smol-rs/async-task.git", rev = "b4486cd71e4e94fbda54ce6302444de14f4d190e" }
