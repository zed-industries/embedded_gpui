[package]
name = "js_runtime"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "A plugin component that embeds QuickJS and runs JavaScript plugins against the object model"

# Deliberately not part of the root workspace: compiled to wasm32-wasip2.
[workspace]

[lib]
path = "src/js_runtime.rs"
crate-type = ["cdylib"]

[dependencies]
anyhow = "1.0"
futures = "0.3"
gpui = { git = "https://github.com/zed-industries/zed.git", branch = "gpui-embedded-in-gpui", default-features = false }
embedded_gpui = { path = "../../embedded_gpui" }
js_runtime_schema = { path = "../js_runtime_schema" }
rquickjs = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = true
opt-level = "s"

[patch.crates-io]
async-task = { git = "https://github.com/smol-rs/async-task.git", rev = "b4486cd71e4e94fbda54ce6302444de14f4d190e" }
